# GitLab SSH Pipeline Runner Configuration
# Every aspect of the webservice, webhook security, SSH cloning,
# pipeline execution, logging, and SQLite auditing is configured here.

server:
  host: "0.0.0.0"
  port: 8090
  app_title: "GitLab SSH Pipeline Runner"
  workers: 1

webhook:
  # Secret token configured in GitLab Project -> Settings -> Webhooks ("Secret token").
  # Leave empty ("") only for local testing; can also be overridden by GITLAB_WEBHOOK_SECRET env var.
  secret_token: ""
  allowed_events:
    - "Push Hook"
    - "Tag Push Hook"
    - "Merge Request Hook"
    - "System Hook"
  # Allowed repository URL prefixes (empty list allows any valid SSH/HTTPS GitLab URL)
  allowed_repo_hosts: []
  # Enable local test repo simulation endpoint for end-to-end verification
  enable_local_simulator: true

ssh:
  # Path to the SSH private key used to authenticate with GitLab
  private_key_path: "keys/id_ed25519"
  # Optional known_hosts file path
  known_hosts_path: "keys/known_hosts"
  # Set to "yes" in production with known_hosts populated; "accept-new" trusts first connection
  strict_host_key_checking: "accept-new"
  # Timeout in seconds for git clone / fetch operations
  clone_timeout_seconds: 120
  # Shallow clone depth (0 = full clone, >0 = shallow clone depth)
  clone_depth: 50

pipeline:
  # Base directory where ephemeral temporary clone workspaces are created
  temp_base_dir: "/tmp/gitlab_pipeline_workspaces"
  # Config file inside the cloned repository defining pipeline steps
  repo_config_filename: ".pipeline.yml"
  # Alternative repo config filenames checked if primary is absent
  fallback_config_filenames:
    - ".gitlab-pipeline.yml"
    - "pipeline.yml"
  # Fallback commands executed if the repository does not contain a pipeline config file
  default_scripts:
    - name: "Inspect Workspace"
      command: "git status --short && ls -la"
    - name: "Print GitLab Variables"
      command: "env | grep -E '^(GITLAB_|CI_|PIPELINE_)' | sort"
  # Max execution time per pipeline step in seconds
  step_timeout_seconds: 300
  # Number of concurrent background pipeline worker threads
  max_background_workers: 4
  # Always remove temporary clone directory after execution (recommended: true)
  secure_cleanup: true

database:
  # Database vendor: "sqlite" (default), "postgresql", or "mariadb"
  engine: "sqlite"
  # Active SQLite database file path (changeable via config or dashboard)
  sqlite_path: "data/pipeline_audit.db"
  # Allowed parent directory for runtime SQLite database switching
  allowed_dir: "data"
  # Enable SQLite WAL mode for concurrent read/write performance
  wal_mode: true
  # External SQL server settings (used when engine is "postgresql" or "mariadb")
  host: "127.0.0.1"
  port: 5432
  name: "pipeline_audit"
  user: "pipeline_runner"
  # Runtime environment variable holding the PostgreSQL / MariaDB password
  password_env: "RUNNER_DB_PASSWORD"
  # SSL/TLS mode: disable, allow, prefer, require, verify-ca, verify-full
  ssl_mode: "prefer"
  connect_timeout_seconds: 10

logging:
  # Path to the friendly rotating logfile
  log_file: "logs/pipeline_runner.log"
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # Max size per log file in bytes before rotation (5 MB)
  max_bytes: 5242880
  # Number of rotated backup log files to keep
  backup_count: 5

auth:
  # Require authentication on dashboard, configuration, and log pages
  enabled: true
  # Signed session lifetime in seconds (8 hours)
  session_max_age_seconds: 28800
  # Allow local claimed admin login when LDAP is disabled
  allow_local_fallback: true
  ldap:
    # Enable LDAP / Active Directory authentication
    enabled: false
    # LDAP server URI (e.g., ldap://ldap.example.com:389 or ldaps://ldap.example.com:636)
    server_uri: "ldap://ldap.example.com:389"
    use_ssl: false
    start_tls: false
    # "direct_bind" (template DN) or "search_bind" (service account search + user bind)
    auth_mode: "direct_bind"
    base_dn: "dc=example,dc=com"
    user_dn_template: "uid={username},ou=people,dc=example,dc=com"
    bind_dn: ""
    bind_password_env: "LDAP_BIND_PASSWORD"
    user_search_filter: "(|(uid={username})(sAMAccountName={username})(mail={username}))"
    allowed_group_dn: ""
    timeout_seconds: 10

branding:
  # Brand name displayed in sidebar, header, and login page
  brand_name: "Pipeline Runner"
  # Optional custom logo URL or uploaded /static/branding/... path (empty = default geometric SVG mark)
  logo_path: ""
  # Short subtitle shown on the login page
  login_subtitle: "GitLab SSH Pipeline Runner"
