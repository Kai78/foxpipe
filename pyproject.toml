[project]
name = "gitlab-ssh-pipeline-runner"
version = "1.0.0"
description = "Python 3.11 GitLab webhook receiver, SSH repository cloner, background pipeline runner, SQLite audit logger, and Jinja2 + Tailwind CSS dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.92.0",
    "uvicorn>=0.17.6",
    "jinja2>=3.1.2",
    "PyYAML>=6.0",
    "python-multipart>=0.0.5",
    "ldap3>=2.9.1",
    "itsdangerous>=2.1.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
